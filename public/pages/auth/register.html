<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TileKick — Crear cuenta</title>
    <link rel="stylesheet" href="/styles/index.css">
    <link rel="stylesheet" href="/styles/components/toast.css">
    <link rel="stylesheet" href="/styles/auth/auth.css">
</head>

<body class="auth-page">

    <div class="auth-card" style="max-width: 460px;">

        <!-- Encabezado -->
        <div class="auth-card-header">
            <h1>Crear cuenta</h1>
            <p class="auth-card-subtitle">Únete gratis y comienza a jugar en segundos.</p>
        </div>

        <!-- Formulario -->
        <form id="registerForm" class="auth-form">

            <div class="auth-field">
                <label for="name">Nombre completo</label>
                <input class="input" type="text" id="name" name="name"
                       placeholder="Tu nombre" autocomplete="name">
            </div>

            <div class="auth-field">
                <label for="username">Usuario</label>
                <input class="input" type="text" id="username" name="username"
                       placeholder="Nombre de usuario único" autocomplete="username">
            </div>

            <div class="auth-field">
                <label for="email">Correo electrónico</label>
                <input class="input" type="email" id="email" name="email"
                       placeholder="tu@correo.com" autocomplete="email">
            </div>

            <div class="auth-field">
                <label for="password">Contraseña</label>
                <input class="input" type="password" id="password" name="password"
                       placeholder="Mínimo 6 caracteres" autocomplete="new-password">
            </div>

            <div class="auth-field">
                <label for="confirmPassword">Confirmar contraseña</label>
                <input class="input" type="password" id="confirmPassword" name="confirmPassword"
                       placeholder="Repite tu contraseña" autocomplete="new-password">
            </div>

            <button type="submit" id="registerBtn" class="btn btn-primary btn-submit">Crear cuenta</button>

        </form>

        <p class="auth-footer">
            ¿Ya tienes cuenta? <a href="/login">Iniciar sesión</a>
        </p>

    </div>

    <script src="/js/components/toast.js"></script>
    <script>
        const form = document.getElementById('registerForm');
        const btn  = document.getElementById('registerBtn');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const body = {
                name:            document.getElementById('name').value.trim(),
                username:        document.getElementById('username').value.trim(),
                email:           document.getElementById('email').value.trim(),
                password:        document.getElementById('password').value,
                confirmPassword: document.getElementById('confirmPassword').value,
            };

            if (!body.name || !body.username || !body.email || !body.password || !body.confirmPassword) {
                Toast.warning('Por favor completa todos los campos.', { position: 'top-center' });
                return;
            }

            if (body.password !== body.confirmPassword) {
                Toast.error('Las contraseñas no coinciden.', { position: 'top-center' });
                return;
            }

            if (body.password.length < 6) {
                Toast.warning('La contraseña debe tener al menos 6 caracteres.', { position: 'top-center' });
                return;
            }

            btn.disabled    = true;
            btn.textContent = 'Creando cuenta…';

            try {
                const res  = await fetch('/register', {
                    method:  'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body:    JSON.stringify(body),
                });
                const data = await res.json();

                if (!res.ok) {
                    Toast.error(data.error || 'Error al registrarse.', { position: 'top-center' });
                    return;
                }

                Toast.success('¡Cuenta creada! Redirigiendo al login…', { position: 'top-center', duration: 2000 });
                setTimeout(() => { window.location.href = '/login'; }, 1500);

            } catch {
                Toast.error('No se pudo conectar con el servidor.', { position: 'top-center' });
            } finally {
                btn.disabled    = false;
                btn.textContent = 'Crear cuenta';
            }
        });
    </script>

</body>
</html>
