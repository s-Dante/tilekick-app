<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TileKick - Registro</title>
    <link rel="stylesheet" type="text/css" href="/styles/index.css">
</head>

<body>
    <main>
        <section>
            <div>
                <h1>TileKick</h1>
            </div>
            <div>
                <form id="registerForm">
                    <label for="name">Nombre</label>
                    <input type="text" name="name" id="name" placeholder="Nombre">

                    <label for="username">Usuario</label>
                    <input type="text" name="username" id="username" placeholder="Usuario">

                    <label for="email">Correo electrónico</label>
                    <input type="email" name="email" id="email" placeholder="Correo electrónico">

                    <label for="password">Contraseña</label>
                    <input type="password" name="password" id="password" placeholder="Contraseña">

                    <label for="confirmPassword">Confirmar contraseña</label>
                    <input type="password" name="confirmPassword" id="confirmPassword" placeholder="Confirmar contraseña">

                    <p id="errorMsg" style="color: red; display: none;"></p>

                    <button type="submit">Registrarse</button>
                </form>
                <p>¿Ya tienes cuenta? <a href="/login">Iniciar sesión</a></p>
            </div>
        </section>
    </main>

    <script>
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const errorMsg = document.getElementById('errorMsg');
            errorMsg.style.display = 'none';

            const body = {
                name: document.getElementById('name').value.trim(),
                username: document.getElementById('username').value.trim(),
                email: document.getElementById('email').value.trim(),
                password: document.getElementById('password').value,
                confirmPassword: document.getElementById('confirmPassword').value,
            };

            const res = await fetch('/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body),
            });

            const data = await res.json();

            if (!res.ok) {
                errorMsg.textContent = data.error || 'Error al registrarse';
                errorMsg.style.display = 'block';
                return;
            }

            // Registro exitoso → ir al login
            window.location.href = '/login';
        });
    </script>
</body>

</html>
