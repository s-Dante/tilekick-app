<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TileKick — Crear cuenta</title>
    <link rel="stylesheet" href="/styles/index.css">
    <link rel="stylesheet" href="/styles/components/toast.css">
    <link rel="stylesheet" href="/styles/auth/auth.css">
</head>

<body class="auth-page">

    <!-- Volver al inicio — fuera del card, esquina superior izquierda -->
    <a href="/" class="auth-back-btn">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M10 13L5 8l5-5"/>
        </svg>
        Volver
    </a>

    <div class="auth-card" style="max-width: 460px;">

        <!-- Encabezado -->
        <div class="auth-card-header">
            <h1>Crear cuenta</h1>
            <p class="auth-card-subtitle">Únete gratis y comienza a jugar en segundos.</p>
        </div>

        <!-- Botones sociales: solo icono en fila -->
        <div class="social-btns" style="margin-bottom: 20px;">
            <a href="/auth/google" class="btn-social google" title="Google" aria-label="Registrarse con Google">
                <svg viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
                    <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
                    <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
                    <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
                    <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
                </svg>
            </a>
            <a href="/auth/facebook" class="btn-social facebook" title="Facebook" aria-label="Registrarse con Facebook">
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path fill="#1877F2" d="M24 12.073C24 5.404 18.627 0 12 0S0 5.404 0 12.073C0 18.1 4.388 23.094 10.125 24v-8.437H7.078v-3.49h3.047V9.41c0-3.025 1.792-4.696 4.533-4.696 1.312 0 2.686.236 2.686.236v2.97H15.83c-1.491 0-1.956.93-1.956 1.886v2.255h3.328l-.532 3.49h-2.796V24C19.612 23.094 24 18.1 24 12.073z"/>
                </svg>
            </a>
            <a href="/auth/github" class="btn-social github" title="GitHub" aria-label="Registrarse con GitHub">
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path fill="currentColor" d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"/>
                </svg>
            </a>
        </div>

        <!-- Divisor -->
        <div class="auth-divider">o crea una cuenta con correo</div>

        <!-- Formulario -->
        <form id="registerForm" class="auth-form">

            <div class="auth-field">
                <label for="name">Nombre completo</label>
                <input class="input" type="text" id="name" name="name"
                       placeholder="Tu nombre" autocomplete="name">
            </div>

            <div class="auth-field">
                <label for="username">Usuario</label>
                <input class="input" type="text" id="username" name="username"
                       placeholder="Nombre de usuario único" autocomplete="username">
            </div>

            <div class="auth-field">
                <label for="email">Correo electrónico</label>
                <input class="input" type="email" id="email" name="email"
                       placeholder="tu@correo.com" autocomplete="email">
            </div>

            <div class="auth-field">
                <label for="password">Contraseña</label>
                <input class="input" type="password" id="password" name="password"
                       placeholder="Mínimo 6 caracteres" autocomplete="new-password">
            </div>

            <div class="auth-field">
                <label for="confirmPassword">Confirmar contraseña</label>
                <input class="input" type="password" id="confirmPassword" name="confirmPassword"
                       placeholder="Repite tu contraseña" autocomplete="new-password">
            </div>

            <button type="submit" id="registerBtn" class="btn btn-primary btn-submit">Crear cuenta</button>

        </form>

        <p class="auth-footer">
            ¿Ya tienes cuenta? <a href="/login">Iniciar sesión</a>
        </p>

    </div>

    <script src="/js/components/toast.js"></script>
    <script>
        // Mostrar error OAuth si viene en la URL
        const params = new URLSearchParams(window.location.search);
        const oauthError = params.get('error');
        if (oauthError) {
            const msgs = {
                oauth_denied:          'Acceso denegado. Intenta de nuevo.',
                oauth_failed:          'Error al conectar con el proveedor. Intenta de nuevo.',
                oauth_not_configured:  'Este proveedor no está configurado aún.',
                server:                'Error interno del servidor.',
            };
            Toast.error(msgs[oauthError] || 'Error de autenticación.', { position: 'top-center', duration: 4000 });
        }

        const form = document.getElementById('registerForm');
        const btn  = document.getElementById('registerBtn');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const body = {
                name:            document.getElementById('name').value.trim(),
                username:        document.getElementById('username').value.trim(),
                email:           document.getElementById('email').value.trim(),
                password:        document.getElementById('password').value,
                confirmPassword: document.getElementById('confirmPassword').value,
            };

            if (!body.name || !body.username || !body.email || !body.password || !body.confirmPassword) {
                Toast.warning('Por favor completa todos los campos.', { position: 'top-center' });
                return;
            }

            if (body.password !== body.confirmPassword) {
                Toast.error('Las contraseñas no coinciden.', { position: 'top-center' });
                return;
            }

            if (body.password.length < 6) {
                Toast.warning('La contraseña debe tener al menos 6 caracteres.', { position: 'top-center' });
                return;
            }

            btn.disabled    = true;
            btn.textContent = 'Creando cuenta…';

            try {
                const res  = await fetch('/register', {
                    method:  'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body:    JSON.stringify(body),
                });
                const data = await res.json();

                if (!res.ok) {
                    Toast.error(data.error || 'Error al registrarse.', { position: 'top-center' });
                    return;
                }

                Toast.success('¡Cuenta creada! Redirigiendo al login…', { position: 'top-center', duration: 2000 });
                setTimeout(() => { window.location.href = '/login'; }, 1500);

            } catch {
                Toast.error('No se pudo conectar con el servidor.', { position: 'top-center' });
            } finally {
                btn.disabled    = false;
                btn.textContent = 'Crear cuenta';
            }
        });
    </script>

</body>
</html>
