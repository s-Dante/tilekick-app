<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TileKick — Iniciar sesión</title>
    <link rel="stylesheet" href="/styles/index.css">
    <link rel="stylesheet" href="/styles/auth/auth.css">
</head>

<body class="auth-page">

    <div class="auth-card">

        <!-- Encabezado -->
        <div class="auth-card-header">
            <h1>Iniciar sesión</h1>
            <p class="auth-card-subtitle">Bienvenido de vuelta. Ingresa tus credenciales.</p>
        </div>

        <!-- Formulario -->
        <form id="loginForm" class="auth-form">

            <div class="auth-field">
                <label for="username">Usuario</label>
                <input class="input" type="text" id="username" name="username"
                       placeholder="Tu nombre de usuario" autocomplete="username">
            </div>

            <div class="auth-field">
                <label for="password">Contraseña</label>
                <input class="input" type="password" id="password" name="password"
                       placeholder="Tu contraseña" autocomplete="current-password">
                <a href="#" class="auth-inline-link">¿Olvidaste tu contraseña?</a>
            </div>

            <p id="errorMsg" class="error-msg"></p>

            <button type="submit" class="btn btn-primary btn-submit">Iniciar sesión</button>

        </form>

        <p class="auth-footer">
            ¿No tienes cuenta? <a href="/register">Regístrate gratis</a>
        </p>

    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const errorMsg = document.getElementById('errorMsg');
            errorMsg.style.display = 'none';

            const body = {
                username: document.getElementById('username').value.trim(),
                password: document.getElementById('password').value,
            };

            const res  = await fetch('/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body),
            });
            const data = await res.json();

            if (!res.ok) {
                errorMsg.textContent   = data.error || 'Error al iniciar sesión';
                errorMsg.style.display = 'block';
                return;
            }

            window.location.href = '/dashboard';
        });
    </script>

</body>
</html>
