<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TileKick - Login</title>
    <link rel="stylesheet" type="text/css" href="/styles/index.css">
</head>

<body>
    <main>
        <section>
            <div>
                <h1>TileKick</h1>
            </div>
            <div>
                <form id="loginForm">
                    <label for="username">Usuario</label>
                    <input type="text" name="username" id="username" placeholder="Usuario">

                    <a href="">¿Olvidaste tu contraseña?</a>
                    <label for="password">Contraseña</label>
                    <input type="password" name="password" id="password" placeholder="Contraseña">

                    <p id="errorMsg" style="color: red; display: none;"></p>

                    <button type="submit">Iniciar sesión</button>
                </form>
                <p>¿No tienes cuenta? <a href="/register">Registrarse</a></p>
            </div>
            <div>
                <p>o</p>
                <button>Google</button>
                <button>Facebook</button>
            </div>
        </section>
    </main>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const errorMsg = document.getElementById('errorMsg');
            errorMsg.style.display = 'none';

            const body = {
                username: document.getElementById('username').value.trim(),
                password: document.getElementById('password').value,
            };

            const res = await fetch('/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body),
            });

            const data = await res.json();

            if (!res.ok) {
                errorMsg.textContent = data.error || 'Error al iniciar sesión';
                errorMsg.style.display = 'block';
                return;
            }

            // El token se guarda en cookie httpOnly desde el servidor.
            // Solo redirigimos al dashboard.
            window.location.href = '/dashboard';
        });
    </script>
</body>

</html>
