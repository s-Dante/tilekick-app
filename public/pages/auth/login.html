<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TileKick — Iniciar sesión</title>
    <link rel="stylesheet" href="/styles/index.css">
    <link rel="stylesheet" href="/styles/components/toast.css">
    <link rel="stylesheet" href="/styles/auth/auth.css">
</head>

<body class="auth-page">

    <div class="auth-card">

        <!-- Encabezado -->
        <div class="auth-card-header">
            <h1>Iniciar sesión</h1>
            <p class="auth-card-subtitle">Bienvenido de vuelta. Ingresa tus credenciales.</p>
        </div>

        <!-- Formulario -->
        <form id="loginForm" class="auth-form">

            <div class="auth-field">
                <label for="username">Usuario</label>
                <input class="input" type="text" id="username" name="username"
                       placeholder="Tu nombre de usuario" autocomplete="username">
            </div>

            <div class="auth-field">
                <label for="password">Contraseña</label>
                <input class="input" type="password" id="password" name="password"
                       placeholder="Tu contraseña" autocomplete="current-password">
                <a href="/recovery" class="auth-inline-link">¿Olvidaste tu contraseña?</a>
            </div>

            <button type="submit" id="loginBtn" class="btn btn-primary btn-submit">Iniciar sesión</button>

        </form>

        <p class="auth-footer">
            ¿No tienes cuenta? <a href="/register">Regístrate gratis</a>
        </p>

    </div>

    <script src="/js/components/toast.js"></script>
    <script>
        const form = document.getElementById('loginForm');
        const btn  = document.getElementById('loginBtn');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;

            if (!username || !password) {
                Toast.warning('Por favor completa todos los campos.', { position: 'top-center' });
                return;
            }

            btn.disabled    = true;
            btn.textContent = 'Ingresando…';

            try {
                const res  = await fetch('/login', {
                    method:  'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body:    JSON.stringify({ username, password }),
                });
                const data = await res.json();

                if (!res.ok) {
                    Toast.error(data.error || 'Error al iniciar sesión.', { position: 'top-center' });
                    return;
                }

                Toast.success('¡Bienvenido!', { position: 'top-center', duration: 1500 });
                setTimeout(() => { window.location.href = '/dashboard'; }, 800);

            } catch {
                Toast.error('No se pudo conectar con el servidor.', { position: 'top-center' });
            } finally {
                btn.disabled    = false;
                btn.textContent = 'Iniciar sesión';
            }
        });
    </script>

</body>
</html>
