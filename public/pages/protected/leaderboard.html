<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TileKick - Clasificación</title>
    <link rel="stylesheet" href="/styles/index.css">
</head>

<body>
    <div id="layout">

        <!-- Barra lateral -->
        <nav id="sidebar">
            <div id="sidebar-header">
                <h2>TileKick</h2>
            </div>
            <ul id="sidebar-nav">
                <li><a href="/dashboard">Inicio</a></li>
                <li><a href="/game/menu">Jugar</a></li>
                <li><a href="/leaderboard">Clasificación</a></li>
                <li><a href="/profile">Perfil</a></li>
                <li><a href="/settings">Configuración</a></li>
            </ul>
            <div id="sidebar-footer">
                <a href="/logout" id="logout-btn">Cerrar sesión</a>
            </div>
        </nav>

        <!-- Contenido principal -->
        <main id="content">
            <h1>Clasificación global</h1>

            <table id="leaderboard-table">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Jugador</th>
                        <th>Victorias</th>
                        <th>Derrotas</th>
                        <th>Puntos</th>
                    </tr>
                </thead>
                <tbody id="leaderboard-body">
                    <!-- Se pobla dinámicamente -->
                    <tr>
                        <td colspan="5">Cargando clasificación...</td>
                    </tr>
                </tbody>
            </table>
        </main>

    </div>
</body>

</html>
