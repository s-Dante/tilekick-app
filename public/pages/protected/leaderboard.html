<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TileKick — Clasificación</title>
    <link rel="stylesheet" href="/styles/index.css">
    <link rel="stylesheet" href="/styles/protected/layout.css">
    <link rel="stylesheet" href="/styles/protected/leaderboard.css">
</head>

<body>
<div id="layout">

    <nav id="sidebar">
        <div id="sidebar-header">
            <h2>TileKick</h2>
        </div>
        <ul id="sidebar-nav">
            <li><a href="/dashboard">Inicio</a></li>
            <li><a href="/game/menu">Jugar</a></li>
            <li><a href="/leaderboard">Clasificación</a></li>
            <li><a href="/profile">Perfil</a></li>
            <li><a href="/settings">Configuración</a></li>
        </ul>
        <div id="sidebar-footer">
            <a href="/logout" id="logout-btn">Cerrar sesión</a>
        </div>
    </nav>

    <main id="content">

        <div class="page-header">
            <h1>Clasificación global</h1>
            <p>Los mejores jugadores de TileKick en todo el mundo.</p>
        </div>

        <div class="leaderboard-table-wrap">
            <table id="leaderboard-table">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Jugador</th>
                        <th>Victorias</th>
                        <th>Derrotas</th>
                        <th>Empates</th>
                        <th>Puntos</th>
                    </tr>
                </thead>
                <tbody id="leaderboard-body">
                    <tr>
                        <td colspan="6" style="text-align:center; color: var(--text-muted); padding: 2rem;">
                            Cargando clasificación...
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

    </main>

</div>
<script>
    document.querySelectorAll('#sidebar-nav a').forEach(link => {
        if (new URL(link.href).pathname === window.location.pathname)
            link.classList.add('active');
    });
</script>
</body>
</html>
