<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TileKick - Configuración</title>
    <link rel="stylesheet" href="/styles/index.css">
</head>

<body>
    <div id="layout">

        <!-- Barra lateral -->
        <nav id="sidebar">
            <div id="sidebar-header">
                <h2>TileKick</h2>
            </div>
            <ul id="sidebar-nav">
                <li><a href="/dashboard">Inicio</a></li>
                <li><a href="/game/menu">Jugar</a></li>
                <li><a href="/leaderboard">Clasificación</a></li>
                <li><a href="/profile">Perfil</a></li>
                <li><a href="/settings">Configuración</a></li>
            </ul>
            <div id="sidebar-footer">
                <a href="/logout" id="logout-btn">Cerrar sesión</a>
            </div>
        </nav>

        <!-- Contenido principal -->
        <main id="content">
            <h1>Configuración</h1>

            <section>
                <h2>Cuenta</h2>
                <form id="settingsForm">
                    <label for="name">Nombre</label>
                    <input type="text" id="name" name="name" placeholder="Tu nombre">

                    <label for="email">Correo electrónico</label>
                    <input type="email" id="email" name="email" placeholder="Tu correo">

                    <label for="currentPassword">Contraseña actual</label>
                    <input type="password" id="currentPassword" name="currentPassword" placeholder="Contraseña actual">

                    <label for="newPassword">Nueva contraseña</label>
                    <input type="password" id="newPassword" name="newPassword" placeholder="Nueva contraseña">

                    <button type="submit">Guardar cambios</button>
                </form>
            </section>

            <section>
                <h2>Preferencias</h2>
                <label for="language">Idioma</label>
                <select id="language" name="language">
                    <option value="es">Español</option>
                    <option value="en">English</option>
                </select>
            </section>
        </main>

    </div>
</body>

</html>
