<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TileKick — Buscar partida</title>
    <link rel="stylesheet" href="/styles/index.css">
    <link rel="stylesheet" href="/styles/components/toast.css">
    <link rel="stylesheet" href="/styles/protected/layout.css">
    <link rel="stylesheet" href="/styles/protected/game/menu.css">
</head>

<body>
    <div id="layout">

        <!-- Sidebar -->
        <nav id="sidebar">
            <div id="sidebar-header">
                <h2>TILEKICK</h2>
            </div>

            <ul id="sidebar-nav">
                <li><a href="/dashboard"><span>Inicio</span></a></li>
                <li><a href="/game/menu"><span>Jugar</span></a></li>
                <li><a href="/leaderboard"><span>Clasificación</span></a></li>
                <li><a href="/rules"><span>Reglas</span></a></li>
            </ul>

            <div id="sidebar-bottom">
                <a href="/settings" class="nav-link-bottom"><span>Configuración</span></a>

                <div class="nav-profile-card" id="nav-profile-card">
                    <div class="profile-dropdown" id="profile-dropdown">
                        <a href="/profile" class="dropdown-item">👤 Ver perfil</a>
                        <a href="/logout" class="dropdown-item logout">🚪 Cerrar sesión</a>
                    </div>
                    <div class="nav-avatar">
                        <img id="nav-avatar-img" src="" alt="" style="display:none;">
                        <span id="nav-avatar-fallback">👤</span>
                    </div>
                    <div class="nav-user-info">
                        <div class="nav-username" id="nav-username">Cargando...</div>
                    </div>
                    <div class="nav-dots">⋮</div>
                </div>
            </div>
        </nav>

        <main id="content">

            <div class="page-header">
                <h1>Nueva partida</h1>
                <p>Configura tu partida y comienza a jugar.</p>
            </div>

            <form id="gameMenuForm" class="game-menu-grid">

                <!-- Sección 1: Modo de Juego -->
                <div class="menu-section">
                    <h2 class="section-title">1. Modo de Juego</h2>
                    <div class="selection-grid">
                        <label class="selection-card">
                            <input type="radio" name="mode" value="online" required checked>
                            <div class="card-content">
                                <span class="card-icon">🌐</span>
                                <div class="card-text">
                                    <span class="card-title">Online</span>
                                    <span class="card-desc">Compite contra el mundo</span>
                                </div>
                            </div>
                        </label>
                        <label class="selection-card">
                            <input type="radio" name="mode" value="local">
                            <div class="card-content">
                                <span class="card-icon">👥</span>
                                <div class="card-text">
                                    <span class="card-title">Local</span>
                                    <span class="card-desc">Juega con amigos cerca</span>
                                </div>
                            </div>
                        </label>
                        <label class="selection-card">
                            <input type="radio" name="mode" value="ai">
                            <div class="card-content">
                                <span class="card-icon">🤖</span>
                                <div class="card-text">
                                    <span class="card-title">Contra IA</span>
                                    <span class="card-desc">Practica tus tácticas</span>
                                </div>
                            </div>
                        </label>
                    </div>
                </div>

                <!-- Sección 2: Mapa -->
                <div class="menu-section">
                    <h2 class="section-title">2. Selecciona el Mapa</h2>
                    <div class="selection-grid">
                        <label class="selection-card">
                            <input type="radio" name="map" value="estadio_clasico" required checked>
                            <div class="card-content">
                                <span class="card-icon">🏟️</span>
                                <div class="card-text">
                                    <span class="card-title">Estadio Clásico</span>
                                    <span class="card-desc">Césped tradicional</span>
                                </div>
                            </div>
                        </label>
                        <label class="selection-card">
                            <input type="radio" name="map" value="arena_nocturna">
                            <div class="card-content">
                                <span class="card-icon">🏖️</span>
                                <div class="card-text">
                                    <span class="card-title">Playero</span>
                                    <span class="card-desc">A la orilla del mar</span>
                                </div>
                            </div>
                        </label>
                        <label class="selection-card">
                            <input type="radio" name="map" value="campo_playa">
                            <div class="card-content">
                                <span class="card-icon">🏙️</span>
                                <div class="card-text">
                                    <span class="card-title">Urbano</span>
                                    <span class="card-desc">Calles de la ciudad</span>
                                </div>
                            </div>
                        </label>
                    </div>
                </div>

                <!-- Sección 3: Vista -->
                <div class="menu-section">
                    <h2 class="section-title">3. Estilo Visual</h2>
                    <div class="selection-grid-small">
                        <label class="selection-card">
                            <input type="radio" name="gameType" value="2d" required checked>
                            <div class="card-content">
                                <span class="card-icon">📝</span>
                                <div class="card-text">
                                    <span class="card-title">Vista 2D</span>
                                    <span class="card-desc">Mecánicas clásicas</span>
                                </div>
                            </div>
                        </label>
                        <label class="selection-card">
                            <input type="radio" name="gameType" value="3d">
                            <div class="card-content">
                                <span class="card-icon">🧊</span>
                                <div class="card-text">
                                    <span class="card-title">Inmersión 3D</span>
                                    <span class="card-desc">Experiencia moderna</span>
                                </div>
                            </div>
                        </label>
                    </div>
                </div>

                <div class="submit-bar">
                    <button type="submit" class="btn btn-primary btn-lg" id="submitBtn">Buscar partida</button>
                </div>

            </form>

        </main>

    </div>

    <script src="/js/components/toast.js"></script>
    <script src="/scripts/sidebar.js"></script>
    <script>
        document.getElementById('gameMenuForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const form = e.target;
            const mode = form.querySelector('input[name="mode"]:checked')?.value;
            const map = form.querySelector('input[name="map"]:checked')?.value;
            const gameType = form.querySelector('input[name="gameType"]:checked')?.value;

            if (!mode || !map || !gameType) {
                Toast.error('Por favor selecciona todas las opciones.');
                return;
            }

            const params = new URLSearchParams({ mode, map, gameType });

            if (mode === 'online') {
                window.location.href = `/game/waiting?${params.toString()}`;
            } else {
                const dest = gameType === '3d' ? '/game/3d' : '/game/2d';
                window.location.href = `${dest}?${params.toString()}`;
            }
        });

        document.querySelectorAll('input[name="mode"]').forEach(radio => {
            radio.addEventListener('change', () => {
                const btn = document.getElementById('submitBtn');
                btn.textContent = radio.value === 'online' ? 'Buscar partida' : 'Jugar ahora';
            });
        });
    </script>
</body>

</html>
