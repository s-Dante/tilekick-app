<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TileKick — Buscar partida</title>
    <link rel="stylesheet" href="/styles/index.css">
    <link rel="stylesheet" href="/styles/protected/layout.css">
    <link rel="stylesheet" href="/styles/protected/game/menu.css">
</head>

<body>
    <div id="layout">

        <nav id="sidebar">
            <div id="sidebar-header">
                <h2>TileKick</h2>
            </div>
            <ul id="sidebar-nav">
                <li><a href="/dashboard">Inicio</a></li>
                <li><a href="/game/menu">Jugar</a></li>
                <li><a href="/leaderboard">Clasificación</a></li>
                <li><a href="/profile">Perfil</a></li>
                <li><a href="/settings">Configuración</a></li>
            </ul>
            <div id="sidebar-footer">
                <a href="/logout" id="logout-btn">Cerrar sesión</a>
            </div>
        </nav>

        <main id="content">

            <div class="page-header">
                <h1>Nueva partida</h1>
                <p>Elige el modo, mapa y tipo de juego para comenzar.</p>
            </div>

            <form id="gameMenuForm">
                <div class="form-columns">
                <!-- Modo de juego -->
                <fieldset>
                    <legend>Modo de juego</legend>
                    <div class="radio-group">
                        <div class="radio-option">
                            <input type="radio" name="mode" id="mode-online" value="online" required>
                            <label for="mode-online" class="radio-label">
                                <span class="radio-icon">🌐</span>
                                Multijugador online
                            </label>
                        </div>
                        <div class="radio-option">
                            <input type="radio" name="mode" id="mode-local" value="local">
                            <label for="mode-local" class="radio-label">
                                <span class="radio-icon">🎮</span>
                                Multijugador local
                            </label>
                        </div>
                        <div class="radio-option">
                            <input type="radio" name="mode" id="mode-ai" value="ai">
                            <label for="mode-ai" class="radio-label">
                                <span class="radio-icon">🤖</span>
                                Contra la IA
                            </label>
                        </div>
                    </div>
                </fieldset>

                <!-- Mapa -->
                <fieldset>
                    <legend>Mapa</legend>
                    <div class="radio-group">
                        <div class="radio-option">
                            <input type="radio" name="map" id="map-clasico" value="estadio_clasico" required>
                            <label for="map-clasico" class="radio-label">
                                <span class="radio-icon">🌱</span>
                                Cancha tradicional
                            </label>
                        </div>
                        <div class="radio-option">
                            <input type="radio" name="map" id="map-noche" value="arena_nocturna">
                            <label for="map-noche" class="radio-label">
                                <span class="radio-icon">🏝️</span>
                                Cancha en la playa
                            </label>
                        </div>
                        <div class="radio-option">
                            <input type="radio" name="map" id="map-playa" value="campo_playa">
                            <label for="map-playa" class="radio-label">
                                <span class="radio-icon">🪨</span>
                                Cancha en la calle
                            </label>
                        </div>
                        <div class="radio-option">
                            <input type="radio" name="map" id="map-random" value="aleatorio">
                            <label for="map-random" class="radio-label">
                                <span class="radio-icon">🔀</span>
                                Cancha aleatoria
                            </label>
                        </div>
                    </div>
                </fieldset>

                <!-- Tipo de juego -->
                <fieldset>
                    <legend>Tipo de juego</legend>
                    <div class="radio-group">
                        <div class="radio-option">
                            <input type="radio" name="gameType" id="type-2d" value="2d" required>
                            <label for="type-2d" class="radio-label">
                                <span class="radio-icon">▦</span>
                                2D
                            </label>
                        </div>
                        <div class="radio-option">
                            <input type="radio" name="gameType" id="type-3d" value="3d">
                            <label for="type-3d" class="radio-label">
                                <span class="radio-icon">◈</span>
                                3D
                            </label>
                        </div>
                    </div>
                </fieldset>
                </div>

                <p id="errorMsg" class="error-msg"></p>

                <div class="form-submit-area">
                    <button type="submit" class="btn btn-primary" id="submitBtn">Jugar ahora</button>
                    <a href="/dashboard" class="btn btn-ghost">Cancelar</a>
                </div>

            </form>

        </main>

    </div>

    <script>
        document.querySelectorAll('#sidebar-nav a').forEach(link => {
            if (new URL(link.href).pathname === window.location.pathname)
                link.classList.add('active');
        });

        document.getElementById('gameMenuForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const errorMsg = document.getElementById('errorMsg');
            errorMsg.style.display = 'none';

            const form = e.target;
            const mode = form.querySelector('input[name="mode"]:checked')?.value;
            const map = form.querySelector('input[name="map"]:checked')?.value;
            const gameType = form.querySelector('input[name="gameType"]:checked')?.value;

            if (!mode || !map || !gameType) {
                errorMsg.textContent = 'Por favor selecciona todas las opciones antes de continuar.';
                errorMsg.style.display = 'block';
                return;
            }

            const params = new URLSearchParams({ mode, map, gameType });

            if (mode === 'online') {
                // Modo online → sala de espera con matchmaking por socket
                window.location.href = `/game/waiting?${params.toString()}`;
            } else {
                // Multijugador local o contra IA → ir directo al juego sin espera
                const dest = gameType === '3d' ? '/game/3d' : '/game/2d';
                window.location.href = `${dest}?${params.toString()}`;
            }
        });

        // Cambiar el texto del botón según el modo seleccionado
        document.querySelectorAll('input[name="mode"]').forEach(radio => {
            radio.addEventListener('change', () => {
                const btn = document.getElementById('submitBtn');
                btn.textContent = radio.value === 'online' ? 'Buscar partida' : 'Jugar ahora';
            });
        });
    </script>
</body>

</html>
