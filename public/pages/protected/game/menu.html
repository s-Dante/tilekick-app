<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TileKick - Menú de juego</title>
    <link rel="stylesheet" href="/styles/index.css">
</head>

<body>
    <div id="layout">

        <!-- Barra lateral -->
        <nav id="sidebar">
            <div id="sidebar-header">
                <h2>TileKick</h2>
            </div>
            <ul id="sidebar-nav">
                <li><a href="/dashboard">Inicio</a></li>
                <li><a href="/game/menu">Jugar</a></li>
                <li><a href="/leaderboard">Clasificación</a></li>
                <li><a href="/profile">Perfil</a></li>
                <li><a href="/settings">Configuración</a></li>
            </ul>
            <div id="sidebar-footer">
                <a href="/logout" id="logout-btn">Cerrar sesión</a>
            </div>
        </nav>

        <!-- Contenido principal -->
        <main id="content">
            <h1>Buscar partida</h1>
            <p>Elige las opciones de tu partida y presiona <strong>Buscar partida</strong> para entrar a la sala de espera.</p>

            <form id="gameMenuForm">

                <!-- Modo de juego -->
                <fieldset>
                    <legend>Modo de juego</legend>

                    <label>
                        <input type="radio" name="mode" value="online" required>
                        Multijugador online
                    </label>
                    <label>
                        <input type="radio" name="mode" value="local">
                        Multijugador local
                    </label>
                    <label>
                        <input type="radio" name="mode" value="ai">
                        Contra la IA
                    </label>
                </fieldset>

                <!-- Mapa -->
                <fieldset>
                    <legend>Mapa</legend>

                    <label>
                        <input type="radio" name="map" value="estadio_clasico" required>
                        Estadio clásico
                    </label>
                    <label>
                        <input type="radio" name="map" value="arena_nocturna">
                        Arena nocturna
                    </label>
                    <label>
                        <input type="radio" name="map" value="campo_playa">
                        Campo de playa
                    </label>
                    <label>
                        <input type="radio" name="map" value="aleatorio">
                        Aleatorio
                    </label>
                </fieldset>

                <!-- Tipo de juego -->
                <fieldset>
                    <legend>Tipo de juego</legend>

                    <label>
                        <input type="radio" name="gameType" value="2d" required>
                        2D
                    </label>
                    <label>
                        <input type="radio" name="gameType" value="3d">
                        3D
                    </label>
                </fieldset>

                <p id="errorMsg" style="color: red; display: none;"></p>

                <button type="submit">Buscar partida</button>
            </form>
        </main>

    </div>

    <script>
        document.getElementById('gameMenuForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const errorMsg = document.getElementById('errorMsg');
            errorMsg.style.display = 'none';

            const form = e.target;
            const mode     = form.querySelector('input[name="mode"]:checked')?.value;
            const map      = form.querySelector('input[name="map"]:checked')?.value;
            const gameType = form.querySelector('input[name="gameType"]:checked')?.value;

            if (!mode || !map || !gameType) {
                errorMsg.textContent = 'Por favor selecciona todas las opciones.';
                errorMsg.style.display = 'block';
                return;
            }

            // Redirigir a la sala de espera con las opciones como query params
            const params = new URLSearchParams({ mode, map, gameType });
            window.location.href = `/game/waiting?${params.toString()}`;
        });
    </script>
</body>

</html>
