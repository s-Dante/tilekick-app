<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TileKick — Juego 2D</title>
    <link rel="stylesheet" href="/styles/index.css">
    <link rel="stylesheet" href="/styles/protected/game/game.css">
    <style>
        .my-piece-tag {
            display: inline-block;
            background: rgba(13, 148, 136, 0.15);
            border: 1px solid var(--primary);
            border-radius: 4px;
            padding: 1px 6px;
            font-size: 10px;
            font-weight: 600;
            color: var(--primary);
            letter-spacing: 0.04em;
        }

        .opponent-piece-tag {
            display: inline-block;
            background: rgba(101, 113, 58, 0.15);
            border: 1px solid #7e8e48;
            border-radius: 4px;
            padding: 1px 6px;
            font-size: 10px;
            font-weight: 600;
            color: #7e8e48;
            letter-spacing: 0.04em;
        }

        #my-team-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 10px;
            border-radius: 999px;
            background: rgba(13, 148, 136, 0.1);
            border: 1px solid var(--primary);
            font-size: 11px;
            font-weight: 700;
            color: var(--primary);
            letter-spacing: 0.05em;
        }
    </style>
</head>

<body>
    <div id="game-layout">

        <header id="game-hud">
            <div class="hud-block">
                <span class="hud-logo">TileKick</span>
                <div class="hud-player" id="hud-p1">
                    <span class="player-dot"></span>
                    <span class="player-name" id="hud-p1-name">—</span>
                </div>
                <span class="hud-sep">vs</span>
                <div class="hud-player" id="hud-p2">
                    <span class="player-dot"></span>
                    <span class="player-name" id="hud-p2-name">—</span>
                </div>
            </div>

            <div class="hud-block">
                <div id="score">
                    <span id="score-a">0</span>
                    <span class="score-sep">—</span>
                    <span id="score-b">0</span>
                </div>
            </div>

            <div class="hud-block">
                <span id="my-team-badge">⚽ Equipo —</span>
                <p id="turn-indicator" class="hud-room">Turno: <span id="turn-team">A</span></p>
                <p class="hud-room">Sala <span id="room-id-display">—</span></p>
                <a href="/game/menu" id="exit-btn">Salir</a>
            </div>
        </header>

        <div id="game-area">
            <div id="game-viewport">
                <canvas id="gameCanvas"></canvas>
            </div>

            <aside id="side-panel">
                <div class="side-panel-header">Jugadores</div>
                <div id="side-players">
                    <div class="side-player" id="side-p1">
                        <span class="dot"></span>
                        <div class="player-info">
                            <strong id="side-p1-name">—</strong>
                            <span id="side-p1-status">Conectando...</span>
                        </div>
                    </div>
                    <div class="side-player" id="side-p2">
                        <span class="dot"></span>
                        <div class="player-info">
                            <strong id="side-p2-name">Esperando rival...</strong>
                            <span id="side-p2-status">Sin conectar</span>
                        </div>
                    </div>
                </div>

                <div class="side-panel-header" style="margin-top:4px;">Fase</div>
                <p id="side-phase"
                    style="padding: var(--sp-3) var(--sp-5); font-size: var(--text-xs); color: var(--text-hint); border-bottom: 1px solid var(--border);">
                    <span id="phase-label">Iniciando...</span>
                </p>

                <div class="side-panel-header" style="display: none;">Eventos en vivo</div>
                <div id="side-log-list"></div>
            </aside>
        </div>
    </div>

    <script
        type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }</script>

    <script type="module">
        import { GameState, PHASES } from '/engine/game.js';
        import { AIPlayer, AI_LEVELS } from '/engine/ai.js';
        import { Renderer2D } from '/js/game/renderer2d.js';

        // ── Parámetros ────────────────────────────────────────────
        const params = new URLSearchParams(window.location.search);
        const mode = params.get('mode') ?? 'local';
        const mapName = params.get('map') ?? 'estadio_clasico';
        const roomId = params.get('room') ?? null;

        // ── Usuario ───────────────────────────────────────────────
        const me = await fetch('/api/me').then(r => r.json()).catch(() => ({}));
        const username = me.username ?? 'Jugador';

        // ── Estado del juego ──────────────────────────────────────
        const gs = new GameState({ mapName, mode });

        // ── Variables online ──────────────────────────────────────
        let myTeam = mode === 'online' ? null : 'A'; // null hasta recibir team-assigned
        let socket = null;

        // ── IA ────────────────────────────────────────────────────
        const aiPlayer = mode === 'ai' ? new AIPlayer('B', AI_LEVELS.MEDIUM) : null;

        // ── UI helpers ─────────────────────────────────────────────
        if (roomId) document.getElementById('room-id-display').textContent = roomId;

        function addLog(msg, type = 'info') {
            const list = document.getElementById('side-log-list');
            const now = new Date().toLocaleTimeString('es', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            const el = document.createElement('div');
            el.className = `side-log-entry ${type}`;
            el.innerHTML = `<span class="log-msg">${msg}</span><span class="log-time">${now}</span>`;
            list.appendChild(el);
            list.scrollTop = list.scrollHeight;
        }

        function connectSlot(num, name, team, isMine) {
            const slot = document.getElementById(`side-p${num}`);
            const nameEl = document.getElementById(`side-p${num}-name`);
            const statEl = document.getElementById(`side-p${num}-status`);
            const badge = isMine
                ? `<span class="my-piece-tag">TUS PIEZAS</span>`
                : `<span class="opponent-piece-tag">RIVAL</span>`;
            nameEl.innerHTML = `${name} ${badge}`;
            statEl.textContent = `Equipo ${team}`;
            slot.classList.add('connected');
            const hudName = document.getElementById(`hud-p${num}-name`);
            if (hudName) hudName.textContent = name;
            document.getElementById(`hud-p${num}`)?.classList.add('connected');
        }

        function updateHUD() {
            const { score, turn, phase } = gs;
            document.getElementById('score-a').textContent = score.A;
            document.getElementById('score-b').textContent = score.B;
            document.getElementById('turn-team').textContent = turn;

            const isMyTurn = (myTeam === null || turn === myTeam);
            document.getElementById('turn-indicator').style.color =
                isMyTurn ? 'var(--primary)' : 'var(--text-hint)';

            const phaseMap = {
                [PHASES.MOVE]: isMyTurn ? '✅ Tu turno — mueve una pieza' : '⏳ Turno del rival',
                [PHASES.SAVE]: (myTeam === null || turn === myTeam)
                    ? '🧤 ¡Mueve tu portero para atajar!'
                    : '⏳ El rival elige dónde atajar...',
            };
            document.getElementById('phase-label').textContent = phaseMap[phase] ?? phase;

            for (let i = 1; i <= 2; i++) {
                const team = i === 1 ? 'A' : 'B';
                const active = turn === team;
                document.getElementById(`side-p${i}-status`).textContent =
                    `Equipo ${team} — ${active ? 'Turno actual' : 'Esperando'}`;
            }
        }

        // ── Renderer ──────────────────────────────────────────────
        const canvas = document.getElementById('gameCanvas');

        const renderer = new Renderer2D(canvas, gs, {
            myTeam,  // se actualiza vía renderer.myTeam luego

            onLog: (msg) => {
                addLog(msg);
                updateHUD();
            },

            onAction: (result) => {
                updateHUD();
                renderer.render();

                // ── Modo online: enviar la acción al servidor ──────
                if (mode === 'online' && socket && result._sync) {
                    socket.emit('game-action', result._sync);
                }

                // ── Modo IA: ejecutar turno de la IA ──────────────
                if (mode === 'ai' && gs.turn === 'B' && gs.phase === PHASES.MOVE && aiPlayer) {
                    setTimeout(() => {
                        const aiMove = aiPlayer.computeMove(gs);
                        if (aiMove) {
                            gs.selectPiece(aiMove.pieceId);
                            const r = gs.commitAction(aiMove.targetRow, aiMove.targetCol);
                            if (r.ok) { addLog(`[IA] ${r.event}`); updateHUD(); renderer.render(); }
                        }
                    }, 600);
                }
            },
        });

        // ── Modos local / IA: setup inmediato ─────────────────────
        if (mode === 'local') {
            connectSlot(1, username, 'A', true);
            connectSlot(2, 'Jugador 2', 'B', false);
            document.getElementById('my-team-badge').textContent = '⚽ Local';
            addLog('Partida local iniciada');
            updateHUD();
            renderer.render();
        }

        if (mode === 'ai') {
            connectSlot(1, username, 'A', true);
            connectSlot(2, 'IA', 'B', false);
            document.getElementById('my-team-badge').textContent = '⚽ Equipo A — vs IA';
            addLog('Partida contra la IA iniciada');
            updateHUD();
            renderer.render();
        }

        // ── Modo online: socket.io ────────────────────────────────
        if (mode === 'online') {
            socket = io();

            socket.on('connect', () => {
                addLog('Conectado al servidor');
                socket.emit('join-room', { roomId, username });
            });

            // El servidor asigna nuestro equipo
            socket.on('team-assigned', ({ myTeam: assignedTeam, players }) => {
                myTeam = assignedTeam;
                renderer.myTeam = assignedTeam;  // actualizar renderer

                const badge = document.getElementById('my-team-badge');
                badge.textContent = `⚽ Equipo ${assignedTeam}`;
                badge.style.color = assignedTeam === 'A' ? 'var(--primary)' : '#7e8e48';
                badge.style.borderColor = assignedTeam === 'A' ? 'var(--primary)' : '#7e8e48';

                // Mi slot
                const mySlot = assignedTeam === 'A' ? 1 : 2;
                connectSlot(mySlot, username, assignedTeam, true);

                // Rival ya conectado (si es el segundo en unirse)
                for (const p of players) {
                    const rivalSlot = assignedTeam === 'A' ? 2 : 1;
                    connectSlot(rivalSlot, p.username, p.team, false);
                    addLog(`${p.username} ya estaba en la sala (Equipo ${p.team})`, 'success');
                }

                if (players.length === 0) {
                    addLog('Eres el Equipo A. Esperando oponente...');
                } else {
                    addLog(`¡Partida lista! Eres el Equipo ${assignedTeam}`, 'success');
                }

                updateHUD();
                renderer.render();
            });

            // Otro jugador se une
            socket.on('player-joined', ({ socketId, username: joinedName, team, playerCount }) => {
                if (socketId === socket.id) return;
                const rivalSlot = myTeam === 'A' ? 2 : 1;
                connectSlot(rivalSlot, joinedName, team, false);
                addLog(`${joinedName} se unió como Equipo ${team}`, 'success');
                if (playerCount >= 2) {
                    addLog('¡Ambos conectados! Comienza la partida.', 'success');
                    updateHUD();
                    renderer.render();
                }
            });

            // ── Recibir la acción del oponente y aplicarla ─────────
            socket.on('opponent-action', ({ type, pieceId, targetRow, targetCol, fromTeam }) => {
                let result;

                if (type === 'select-commit') {
                    // 1. Seleccionar la pieza del rival en el GameState local
                    gs.selectPiece(pieceId);
                    // 2. Ejecutar el movimiento
                    result = gs.commitAction(targetRow, targetCol);
                } else if (type === 'commit-save') {
                    result = gs.commitSave(targetRow, targetCol);
                }

                if (result?.ok) {
                    addLog(`[${fromTeam}] ${result.event}`, result.goal ? 'success' : 'info');
                    updateHUD();
                    renderer.render();
                }
            });

            socket.on('player-left', ({ username: leftName, team }) => {
                addLog(`${leftName} (Equipo ${team}) se desconectó`);
            });
        }
    </script>

    <script src="/socket.io/socket.io.js"></script>
</body>

</html>
