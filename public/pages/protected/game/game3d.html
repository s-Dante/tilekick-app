<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TileKick — Juego 3D</title>
    <!-- Open Graph — imagen para compartir en redes sociales -->
    <meta id="og-image" property="og:image" content="/assets/img/share/win.png">
    <meta property="og:title"       content="¡Jugué TileKick 3D! 🎮⚽">
    <meta property="og:description" content="TileKick — el ajedrez del fútbol. ¿Me retas?">
    <meta property="og:type"        content="website">
    <link rel="stylesheet" href="/styles/index.css">
    <link rel="stylesheet" href="/styles/protected/game/game.css">
    <link rel="stylesheet" href="/styles/components/toast.css">
    <style>
        /* ── Badges de equipo ─────────────────────────────── */
        .my-piece-tag {
            display: inline-block;
            background: rgba(13, 148, 136, 0.15);
            border: 1px solid var(--primary);
            border-radius: 4px;
            padding: 1px 6px;
            font-size: 10px;
            font-weight: 600;
            color: var(--primary);
            letter-spacing: 0.04em;
        }
        .opponent-piece-tag {
            display: inline-block;
            background: rgba(101, 113, 58, 0.15);
            border: 1px solid #7e8e48;
            border-radius: 4px;
            padding: 1px 6px;
            font-size: 10px;
            font-weight: 600;
            color: #7e8e48;
            letter-spacing: 0.04em;
        }
        #my-team-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 10px;
            border-radius: 999px;
            background: rgba(13, 148, 136, 0.1);
            border: 1px solid var(--primary);
            font-size: 11px;
            font-weight: 700;
            color: var(--primary);
            letter-spacing: 0.05em;
        }
        .orbit-hint {
            position: absolute;
            bottom: 12px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 11px;
            color: rgba(255,255,255,0.3);
            pointer-events: none;
        }

        /* ── Pantalla de Victoria/Derrota ─────────────────── */
        #game-over-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.85);
            z-index: 9999;
            align-items: center;
            justify-content: center;
        }
        #game-over-overlay.visible {
            display: flex;
        }
        .game-over-modal {
            background: #141920;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 16px;
            padding: 40px 48px;
            max-width: 480px;
            width: 90%;
            text-align: center;
            box-shadow: 0 0 60px rgba(0,0,0,0.8);
        }
        .go-trophy { font-size: 64px; margin-bottom: 8px; }
        .go-title {
            font-size: 28px;
            font-weight: 800;
            letter-spacing: 0.05em;
            margin-bottom: 6px;
        }
        .go-title.win  { color: #fbbf24; }
        .go-title.lose { color: #ef4444; }
        .go-score {
            font-size: 48px;
            font-weight: 900;
            color: #f0efe9;
            margin: 16px 0;
            letter-spacing: 0.1em;
        }
        .go-detail {
            font-size: 13px;
            color: #6b7280;
            margin-bottom: 24px;
        }
        .go-share {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 20px;
        }
        .go-share-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 16px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.12);
            background: rgba(255,255,255,0.06);
            color: #f0efe9;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.15s, transform 0.1s;
        }
        .go-share-btn:hover { background: rgba(255,255,255,0.12); transform: translateY(-1px); }
        .go-share-btn:active { transform: translateY(0); }
        .go-actions {
            display: flex;
            gap: 12px;
            justify-content: center;
        }
        .go-elo {
            display: none;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 10px;
            padding: 10px 20px;
            margin-bottom: 20px;
            font-size: 13px;
            color: #9ca3af;
        }
        .go-elo.visible { display: block; }
        .go-elo-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
        }
        .go-elo-delta.positive { color: #4ade80; font-weight: 700; }
        .go-elo-delta.negative { color: #f87171; font-weight: 700; }
    </style>
</head>

<body>
    <!-- ── Pantalla de fin de partida ──────────────────────── -->
    <div id="game-over-overlay">
        <div class="game-over-modal">
            <div class="go-trophy" id="go-trophy">🏆</div>
            <div class="go-title" id="go-title">¡VICTORIA!</div>
            <div class="go-score" id="go-score">0 — 0</div>
            <div class="go-detail" id="go-detail">Partida finalizada</div>
            <div class="go-elo" id="go-elo">
                <div class="go-elo-row">
                    <span>ELO</span>
                    <span id="go-elo-before">—</span>
                    <span>→</span>
                    <span id="go-elo-after">—</span>
                    <span class="go-elo-delta" id="go-elo-delta"></span>
                </div>
            </div>
            <div class="go-share">
                <button class="go-share-btn" onclick="shareResult('facebook')">
                    <svg width="14" height="14" viewBox="0 0 24 24" style="flex-shrink:0"><path fill="#1877F2" d="M24 12.073C24 5.404 18.627 0 12 0S0 5.404 0 12.073C0 18.1 4.388 23.094 10.125 24v-8.437H7.078v-3.49h3.047V9.41c0-3.025 1.792-4.696 4.533-4.696 1.312 0 2.686.236 2.686.236v2.97H15.83c-1.491 0-1.956.93-1.956 1.886v2.255h3.328l-.532 3.49h-2.796V24C19.612 23.094 24 18.1 24 12.073z"/></svg>
                    Facebook
                </button>
                <button class="go-share-btn" onclick="shareResult('twitter')">
                    <svg width="14" height="14" viewBox="0 0 24 24" style="flex-shrink:0"><path fill="currentColor" d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-4.714-6.231-5.401 6.231H2.746l7.73-8.835L1.254 2.25H8.08l4.259 5.629 5.905-5.629zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
                    X / Twitter
                </button>
                <button class="go-share-btn" id="go-copy-btn" onclick="shareResult('copy')">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="flex-shrink:0"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>
                    Copiar
                </button>
            </div>
            <div class="go-actions">
                <a href="/game/menu" class="btn btn-primary">Jugar de nuevo</a>
                <a href="/dashboard" class="btn">Inicio</a>
            </div>
        </div>
    </div>

    <!-- ── Banner de gol / atajada ────────────────────────── -->
    <div id="game-banner">
        <div class="banner-icon" id="banner-icon">⚽</div>
        <div class="banner-text" id="banner-text">GOOOL!</div>
        <div class="banner-sub"  id="banner-sub"></div>
    </div>

    <div id="game-layout">

        <!-- HUD -->
        <header id="game-hud">
            <div class="hud-block">
                <span class="hud-logo">TileKick</span>
                <div class="hud-player" id="hud-p1">
                    <span class="player-dot"></span>
                    <span class="player-name" id="hud-p1-name">—</span>
                </div>
                <span class="hud-sep">vs</span>
                <div class="hud-player" id="hud-p2">
                    <span class="player-dot"></span>
                    <span class="player-name" id="hud-p2-name">—</span>
                </div>
            </div>

            <div class="hud-block">
                <div id="score">
                    <span id="score-a">0</span>
                    <span class="score-sep">—</span>
                    <span id="score-b">0</span>
                </div>
            </div>

            <div class="hud-block">
                <span id="my-team-badge">⚽ Equipo —</span>
                <p id="turn-indicator" class="hud-room">Turno: <span id="turn-team">A</span></p>
                <p class="hud-room" id="hud-timer-wrap" style="display:none;">⏱ <span id="hud-timer">—</span></p>
                <p class="hud-room">Sala <span id="room-id-display">—</span></p>
                <a href="/game/menu" id="exit-btn">Salir</a>
            </div>
        </header>

        <!-- Área de juego -->
        <div id="game-area">

            <!-- Viewport 3D -->
            <div id="game-viewport" style="position:relative;">
                <div id="gameContainer" style="width:100%;height:100%;"></div>
                <div class="orbit-hint">🖱 Arrastra para rotar la cámara</div>
            </div>

            <!-- Panel lateral -->
            <aside id="side-panel">
                <div class="side-panel-header">Jugadores</div>
                <div id="side-players">
                    <div class="side-player" id="side-p1">
                        <span class="dot"></span>
                        <div class="player-info">
                            <strong id="side-p1-name">—</strong>
                            <span id="side-p1-status">Conectando...</span>
                        </div>
                    </div>
                    <div class="side-player" id="side-p2">
                        <span class="dot"></span>
                        <div class="player-info">
                            <strong id="side-p2-name">Esperando rival...</strong>
                            <span id="side-p2-status">Sin conectar</span>
                        </div>
                    </div>
                </div>

                <div class="side-panel-header" style="margin-top:4px;">Fase</div>
                <p id="side-phase"
                    style="padding: var(--sp-3) var(--sp-5); font-size: var(--text-xs); color: var(--text-hint); border-bottom: 1px solid var(--border);">
                    <span id="phase-label">Iniciando...</span>
                </p>

                <div class="side-panel-header">Eventos</div>
                <div id="side-log-list"></div>
            </aside>

        </div>
    </div>

    <!-- Importmap para Three.js -->
    <script type="importmap">
{
    "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
}
</script>

    <script type="module">
        import { GameState, PHASES } from '/engine/game.js';
        import { AIPlayer, AI_LEVELS } from '/engine/ai.js';
        import { Renderer3D } from '/js/game/renderer3d.js';
        import { AudioManager } from '/js/game/audio.js';

        // ── Parámetros de URL ──────────────────────────────────────
        const params = new URLSearchParams(window.location.search);
        const mode       = params.get('mode')       ?? 'local';
        const mapName    = params.get('map')         ?? 'estadio_clasico';
        const roomId     = params.get('room')        ?? null;
        const difficulty = parseInt(params.get('difficulty') ?? '2');
        const goalLimit  = parseInt(params.get('goals') ?? '5') || 5;
        const timeSecs   = parseInt(params.get('time')  ?? '0') || 0;

        // ── Info del usuario ───────────────────────────────────────
        const me = await fetch('/api/me').then(r => r.json()).catch(() => ({}));
        const username = me.username ?? 'Jugador';

        // ── Preferencias ───────────────────────────────────────────
        const prefs = await fetch('/api/me/preferences').then(r => r.json()).catch(() => ({}));
        const sfxVolume = prefs.sfx_volume ?? 80;

        // ── Estado del juego ───────────────────────────────────────
        const gs = new GameState({ mapName, mode, goalLimit, timeSecs });

        // ── AudioManager ───────────────────────────────────────────
        const audio = new AudioManager(gs.board.theme, { sfxVolume });

        // ── myTeam (null en online hasta asignación) ───────────────
        let myTeam = mode === 'online' ? null : (mode === 'ai' ? 'A' : null);
        let socket = null;

        // ── IA ─────────────────────────────────────────────────────
        const aiPlayer = mode === 'ai' ? new AIPlayer('B', difficulty) : null;

        // ── UI helpers ─────────────────────────────────────────────
        if (roomId) document.getElementById('room-id-display').textContent = roomId;

        function addLog(msg, type = 'info') {
            const list = document.getElementById('side-log-list');
            const now = new Date().toLocaleTimeString('es', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            const el = document.createElement('div');
            el.className = `side-log-entry ${type}`;
            el.innerHTML = `<span class="log-msg">${msg}</span><span class="log-time">${now}</span>`;
            list.appendChild(el);
            list.scrollTop = list.scrollHeight;
        }

        function connectSlot(num, name, team, isMine) {
            const slot   = document.getElementById(`side-p${num}`);
            const nameEl = document.getElementById(`side-p${num}-name`);
            const statEl = document.getElementById(`side-p${num}-status`);
            const badge  = isMine
                ? `<span class="my-piece-tag">TUS PIEZAS</span>`
                : `<span class="opponent-piece-tag">RIVAL</span>`;
            nameEl.innerHTML = `${name} ${badge}`;
            statEl.textContent = `Equipo ${team}`;
            slot.classList.add('connected');
            const hudName = document.getElementById(`hud-p${num}-name`);
            if (hudName) hudName.textContent = name;
            document.getElementById(`hud-p${num}`)?.classList.add('connected');
        }

        function updateHUD() {
            const { score, turn, phase } = gs;
            document.getElementById('score-a').textContent = score.A;
            document.getElementById('score-b').textContent = score.B;
            document.getElementById('turn-team').textContent = turn;

            const isMyTurn = (myTeam === null || turn === myTeam);
            document.getElementById('turn-indicator').style.color =
                isMyTurn ? 'var(--primary)' : 'var(--text-hint)';

            const phaseMap = {
                [PHASES.MOVE]: isMyTurn ? '✅ Tu turno — mueve una pieza' : '⏳ Turno del rival',
                [PHASES.SAVE]: (myTeam === null || turn === myTeam)
                    ? '🧤 ¡Mueve tu portero para atajar!'
                    : '⏳ El rival elige dónde atajar...',
                [PHASES.OVER]: '🏁 Partida finalizada',
            };
            document.getElementById('phase-label').textContent = phaseMap[phase] ?? phase;

            for (let i = 1; i <= 2; i++) {
                const team = i === 1 ? 'A' : 'B';
                const active = turn === team;
                document.getElementById(`side-p${i}-status`).textContent =
                    `Equipo ${team} — ${active ? 'Turno actual' : 'Esperando'}`;
            }
        }

        // ── Temporizador de partida ────────────────────────────────
        let timerInterval = null;
        let secondsLeft   = timeSecs;

        function formatTime(secs) {
            const m = Math.floor(secs / 60);
            const s = secs % 60;
            return `${m}:${s.toString().padStart(2, '0')}`;
        }

        function startTimer() {
            if (timeSecs <= 0) return;    // sin límite
            if (timerInterval !== null) return; // ya iniciado

            const wrap    = document.getElementById('hud-timer-wrap');
            const display = document.getElementById('hud-timer');
            wrap.style.display = '';
            display.textContent = formatTime(secondsLeft);

            timerInterval = setInterval(() => {
                if (gs.isOver()) { clearInterval(timerInterval); return; }
                secondsLeft--;
                display.textContent = formatTime(secondsLeft);

                // Avisos visuales y toasts cuando queda poco tiempo
                if (secondsLeft === 60) {
                    Toast.warning('⏱ 1 minuto restante', { position: 'top-center', duration: 3000, title: '' });
                } else if (secondsLeft === 30) {
                    display.style.color = '#f87171';
                    Toast.warning('⏱ ¡30 segundos!', { position: 'top-center', duration: 3000, title: '' });
                } else if (secondsLeft === 10) {
                    display.style.fontWeight = '800';
                    Toast.error('⏱ ¡10 segundos!', { position: 'top-center', duration: 4000, title: '' });
                }

                if (secondsLeft <= 0) {
                    clearInterval(timerInterval);
                    const { score } = gs;
                    let winner = null;
                    if (score.A > score.B)      winner = 'A';
                    else if (score.B > score.A) winner = 'B';

                    renderer.locked = true;
                    showGameOver(winner, score, 'time');

                    if (mode === 'online' && socket && !gameOverReported) {
                        gameOverReported = true;
                        socket.emit('game-finished', { winnerTeam: winner });
                    }
                }
            }, 1000);
        }

        // ── Pantalla de fin de partida ─────────────────────────────
        let gameOverReported = false;

        function showGameOver(winner, score, reason = 'normal') {
            audio.playGameEnd();

            const overlay = document.getElementById('game-over-overlay');
            const trophy  = document.getElementById('go-trophy');
            const title   = document.getElementById('go-title');
            const scoreEl = document.getElementById('go-score');
            const detail  = document.getElementById('go-detail');

            const isDraw  = (winner === null);
            const isMyWin = !isDraw && (myTeam === null ? winner === 'A' : winner === myTeam);

            if (isDraw) {
                trophy.textContent = '🤝';
                title.textContent  = 'EMPATE';
                title.className    = 'go-title draw';
            } else if (myTeam === null) {
                trophy.textContent = '🏆';
                title.textContent  = `¡Equipo ${winner} gana!`;
                title.className    = 'go-title win';
            } else if (isMyWin) {
                trophy.textContent = '🏆';
                title.textContent  = reason === 'forfeit' ? '¡VICTORIA! (rival abandonó)' : '¡VICTORIA!';
                title.className    = 'go-title win';
            } else {
                trophy.textContent = '😔';
                title.textContent  = 'DERROTA';
                title.className    = 'go-title lose';
            }

            scoreEl.textContent = `${score?.A ?? '—'} — ${score?.B ?? '—'}`;
            detail.textContent  = reason === 'forfeit'
                ? 'El rival se desconectó'
                : reason === 'time'
                    ? 'Tiempo agotado'
                    : `Primero en llegar a ${gs.goalLimit} goles`;
            overlay.classList.add('visible');
            window.gameResultData = { winner, score, username, mode, isMyWin, isDraw };

            // Cambiar OG image según resultado (para el share en redes)
            const ogImg = document.getElementById('og-image');
            if (ogImg) {
                ogImg.content = isDraw
                    ? '/assets/img/share/draw.png'
                    : isMyWin
                        ? '/assets/img/share/win.png'
                        : '/assets/img/share/lose.png';
            }

            // Notificar al servidor (solo online, solo una vez)
            if (mode === 'online' && socket && !gameOverReported) {
                gameOverReported = true;
                socket.emit('game-finished', { winnerTeam: winner });
            }
        }

        // ── Banner animado (gol / atajada) ────────────────────
        let _bannerTimer = null;

        function showBanner(type, title, sub = '') {
            const banner = document.getElementById('game-banner');
            banner.className = 'game-banner';
            // eslint-disable-next-line no-unused-expressions
            banner.offsetHeight;

            document.getElementById('banner-icon').textContent = type === 'goal' ? '⚽' : '🧤';
            document.getElementById('banner-text').textContent = title;
            document.getElementById('banner-sub').textContent  = sub;

            banner.classList.add(`banner-${type}`, 'banner-visible');

            if (_bannerTimer) clearTimeout(_bannerTimer);
            _bannerTimer = setTimeout(() => {
                banner.classList.remove('banner-visible', `banner-${type}`);
            }, 2700);
        }

        // ── Social Share ──────────────────────────────────────
        // Idéntico a game2d.html

        function shareResult(platform) {
            const d      = window.gameResultData ?? {};
            const result = d.isDraw ? 'draw' : d.isMyWin ? 'win' : 'lose';
            const scoreA = d.score?.A ?? 0;
            const scoreB = d.score?.B ?? 0;
            const map    = params.get('map') || 'estadio';

            const shareUrl = `${location.origin}/share?result=${result}&score=${encodeURIComponent(`${scoreA}-${scoreB}`)}&map=${encodeURIComponent(map)}`;
            const imageUrl = `${location.origin}/assets/img/share/${result}.png`;

            const texts = {
                win:  `🏆 ¡Gané en TileKick 3D! Marcador: ${scoreA}–${scoreB}. El fútbol táctico que no sabías que necesitabas. ¿Me retas? ⚽🎮`,
                lose: `😤 Caída épica ${scoreA}–${scoreB} en TileKick 3D, pero vuelvo más fuerte. ¿Puedes ganarme tú? ⚽🎮`,
                draw: `🤝 ¡Empate táctico ${scoreA}–${scoreB} en TileKick 3D! Ninguno cedió. ¿Tú rompes el empate? ⚽🎮`,
            };
            const text = texts[result];

            if (platform === 'facebook') {
                window.open(
                    `https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(shareUrl)}`,
                    'fb-share', 'width=620,height=540,noopener,noreferrer'
                );
                return;
            }

            if (platform === 'twitter') {
                window.open(
                    `https://twitter.com/intent/tweet?text=${encodeURIComponent(text)}&url=${encodeURIComponent(shareUrl)}&hashtags=TileKick`,
                    'tw-share', 'width=600,height=420,noopener,noreferrer'
                );
                return;
            }

            if (platform === 'copy') {
                const copyText = `${text}\n${shareUrl}`;
                const btn = document.getElementById('go-copy-btn');
                fetch(imageUrl)
                    .then(r => r.blob())
                    .then(async (imgBlob) => {
                        try {
                            await navigator.clipboard.write([
                                new ClipboardItem({
                                    'image/png': imgBlob,
                                    'text/plain': new Blob([copyText], { type: 'text/plain' }),
                                })
                            ]);
                        } catch (_) {
                            await navigator.clipboard.writeText(copyText);
                        }
                        if (btn) {
                            const orig = btn.innerHTML;
                            btn.innerHTML = '<span>✓ Copiado</span>';
                            setTimeout(() => { btn.innerHTML = orig; }, 2000);
                        }
                    })
                    .catch(() => {
                        navigator.clipboard?.writeText(copyText)
                            .then(() => {
                                if (btn) {
                                    const orig = btn.innerHTML;
                                    btn.innerHTML = '<span>✓ Texto copiado</span>';
                                    setTimeout(() => { btn.innerHTML = orig; }, 2000);
                                }
                            })
                            .catch(() => prompt('Copia este mensaje:', copyText));
                    });
                return;
            }
        }
        window.shareResult = shareResult;

        // ── Renderer 3D ────────────────────────────────────────────
        const container = document.getElementById('gameContainer');

        const renderer = new Renderer3D(container, gs, {
            myTeam,

            onLog: (msg) => { addLog(msg); updateHUD(); },

            onAction: (result) => {
                updateHUD();

                // Sonidos + notificaciones
                if (result.interception) {
                    if (result.interception.success) {
                        audio.playStealSuccess();
                        Toast.success('⚡ ¡Robo exitoso!', { position: 'bottom-left', duration: 2200, title: '' });
                    } else if (result.interception.protected) {
                        audio.playIllegal();
                        Toast.warning('🛡 El rival está protegido — no puedes robar de inmediato', { position: 'bottom-left', duration: 2500, title: '' });
                    } else {
                        audio.playStealFail();
                        Toast.info('✋ Robo fallido — el rival conserva el balón', { position: 'bottom-left', duration: 1800, title: '' });
                    }
                } else if (result.goal) {
                    audio.playGoal();
                    showBanner('goal', '¡GOOOL!',
                        `Equipo ${result.scorer} · ${result.score?.A ?? gs.score.A}–${result.score?.B ?? gs.score.B}`);
                } else if (result.saved) {
                    audio.playSave();
                    showBanner('save', '¡ATAJADA!', 'El portero detiene el disparo');
                } else if (result.pass) {
                    audio.playPass();
                    Toast.info(`⚽ ${result.event}`, { position: 'bottom-left', duration: 1400, title: '' });
                } else {
                    audio.playMove();
                }

                // Online: enviar acción al servidor ANTES de mostrar game-over,
                // para que el rival también reciba el último movimiento.
                if (mode === 'online' && socket && result._sync) {
                    socket.emit('game-action', result._sync);
                }

                // Game over
                if (result.gameOver) {
                    renderer.locked = true;
                    showGameOver(result.winner, result.score);
                    return;
                }

                // ── Modo IA: ceder el turno si corresponde ────
                if (mode === 'ai') handleAITurn();
            },
        });

        // Primer render
        renderer.updateScene();
        updateHUD();

        // ── Turno de la IA (maneja MOVE y SAVE) ──────────────
        function handleAITurn() {
            if (!aiPlayer || gs.isOver() || gs.turn !== 'B') return;
            renderer.locked = true;

            if (gs.phase === PHASES.SAVE) {
                // Humano disparó → portero IA ataja
                setTimeout(() => {
                    if (gs.isOver()) { renderer.locked = false; return; }
                    const save = aiPlayer.computeSave(gs);
                    const r = gs.commitSave(save.row, save.col);
                    if (r.ok) {
                        addLog(`[IA] ${r.event}`);
                        if (r.goal) {
                            audio.playGoal();
                            showBanner('goal', '¡GOOOL!',
                                `Equipo ${r.scorer} · ${r.score?.A ?? gs.score.A}–${r.score?.B ?? gs.score.B}`);
                        } else if (r.saved) {
                            audio.playSave();
                            showBanner('save', '¡ATAJADA!', 'El portero detuvo el disparo');
                        }
                        updateHUD();
                        renderer.updateScene();
                        if (r.gameOver) {
                            renderer.locked = true;
                            showGameOver(r.winner, r.score);
                            return;
                        }
                    }
                    renderer.locked = false;
                    // Si la atajada fue exitosa, IA tiene el balón → su turno de MOVE
                    if (!gs.isOver()) handleAITurn();
                }, 500);

            } else if (gs.phase === PHASES.MOVE) {
                setTimeout(() => {
                    if (gs.isOver()) { renderer.locked = false; return; }
                    const aiMove = aiPlayer.computeMove(gs);
                    if (aiMove) {
                        gs.selectPiece(aiMove.pieceId);
                        const r = gs.commitAction(aiMove.targetRow, aiMove.targetCol);
                        if (r.ok) {
                            addLog(`[IA] ${r.event}`);
                            if (r.interception) {
                                if (r.interception.success) {
                                    audio.playStealSuccess();
                                    Toast.warning('⚡ ¡La IA robó el balón!', { position: 'bottom-left', duration: 2200, title: '' });
                                } else {
                                    audio.playStealFail();
                                }
                            } else if (r.goal) {
                                audio.playGoal();
                                showBanner('goal', '¡GOOOL!',
                                    `Equipo ${r.scorer} · ${r.score?.A ?? gs.score.A}–${r.score?.B ?? gs.score.B}`);
                            } else {
                                audio.playOpponentMove();
                            }
                            updateHUD();
                            renderer.updateScene();
                            if (r.gameOver) {
                                renderer.locked = true;
                                showGameOver(r.winner, r.score);
                                return;
                            }
                            // Si la IA disparó → phase=SAVE, turn=A (humano ataja) → no recursión
                        }
                    }
                    renderer.locked = false;
                }, 800);
            } else {
                renderer.locked = false;
            }
        }

        // ── Setup según modo ───────────────────────────────────────
        if (mode === 'local') {
            connectSlot(1, username, 'A', true);
            connectSlot(2, 'Jugador 2', 'B', false);
            document.getElementById('my-team-badge').textContent = '⚽ Local';
            addLog('Partida local 3D iniciada. Arrastra para rotar la cámara.');
            audio.playGameStart();
            startTimer();
        }

        if (mode === 'ai') {
            const diffLabels = { 1: 'Fácil', 2: 'Medio', 3: 'Difícil' };
            connectSlot(1, username, 'A', true);
            connectSlot(2, `IA (${diffLabels[difficulty] ?? 'Medio'})`, 'B', false);
            document.getElementById('my-team-badge').textContent = '⚽ Equipo A — vs IA';
            addLog(`Partida 3D contra la IA (${diffLabels[difficulty] ?? 'Medio'}). Arrastra para rotar.`);
            audio.playGameStart();
            startTimer();
        }

        // ── Socket.io para modo online ─────────────────────────────
        if (mode === 'online') {
            socket = io();

            socket.on('connect', () => {
                addLog('Conectado al servidor');
                socket.emit('join-room', { roomId, username });
            });

            // Asignación de equipo
            socket.on('team-assigned', ({ myTeam: assignedTeam, players }) => {
                myTeam = assignedTeam;
                renderer.myTeam = assignedTeam;
                renderer.orbitAngle = assignedTeam === 'B' ? 0 : Math.PI;
                renderer._updateCamera();

                const badge = document.getElementById('my-team-badge');
                badge.textContent = `⚽ Equipo ${assignedTeam}`;
                badge.style.color = assignedTeam === 'A' ? 'var(--primary)' : '#7e8e48';
                badge.style.borderColor = assignedTeam === 'A' ? 'var(--primary)' : '#7e8e48';

                const mySlot = assignedTeam === 'A' ? 1 : 2;
                connectSlot(mySlot, username, assignedTeam, true);

                for (const p of players) {
                    const rivalSlot = assignedTeam === 'A' ? 2 : 1;
                    connectSlot(rivalSlot, p.username, p.team, false);
                    addLog(`${p.username} ya estaba en la sala (Equipo ${p.team})`, 'success');
                }

                if (players.length === 0) {
                    addLog('Eres el Equipo A. Esperando oponente...');
                } else {
                    addLog(`¡Partida lista! Eres el Equipo ${assignedTeam}`, 'success');
                    audio.playGameStart();
                    startTimer();
                }

                updateHUD();
                renderer.updateScene();
            });

            // Rival se une
            socket.on('player-joined', ({ socketId, username: joinedName, team, playerCount }) => {
                if (socketId === socket.id) return;
                const rivalSlot = myTeam === 'A' ? 2 : 1;
                connectSlot(rivalSlot, joinedName, team, false);
                addLog(`${joinedName} se unió como Equipo ${team}`, 'success');
                if (playerCount >= 2) {
                    addLog('¡Ambos conectados! Comienza la partida.', 'success');
                    audio.playGameStart();
                    updateHUD();
                    renderer.updateScene();
                    startTimer();
                }
            });

            // Recibir acción del oponente
            socket.on('opponent-action', ({ type, pieceId, targetRow, targetCol, stealSuccess, fromTeam }) => {
                if (gs.isOver()) return;
                let result;

                if (type === 'select-commit') {
                    gs.selectPiece(pieceId);
                    // Si viene stealSuccess del sender, forzar ese resultado (sync determinista)
                    if (stealSuccess !== undefined) gs._forcedStealSuccess = stealSuccess;
                    result = gs.commitAction(targetRow, targetCol);
                } else if (type === 'commit-save') {
                    result = gs.commitSave(targetRow, targetCol);
                }

                if (result?.ok) {
                    addLog(`[${fromTeam}] ${result.event}`, result.goal ? 'success' : 'info');
                    if (result.interception) {
                        if (result.interception.success) {
                            audio.playStealSuccess();
                            Toast.warning('⚡ ¡El rival robó el balón!', { position: 'bottom-left', duration: 2200, title: '' });
                        } else {
                            audio.playStealFail();
                        }
                    } else if (result.goal) {
                        audio.playGoal();
                        showBanner('goal', '¡GOOOL!',
                            `Equipo ${result.scorer} · ${result.score?.A ?? gs.score.A}–${result.score?.B ?? gs.score.B}`);
                    } else if (result.saved) {
                        audio.playSave();
                        showBanner('save', '¡ATAJADA!', 'El portero detuvo el disparo');
                    } else {
                        audio.playOpponentMove();
                    }
                    updateHUD();
                    renderer.updateScene();
                    if (result.gameOver) {
                        renderer.locked = true;
                        showGameOver(result.winner, result.score);
                    }
                }
            });

            socket.on('self-play-error', ({ message }) => {
                addLog(`⚠️ ${message}`);
                setTimeout(() => { window.location.href = '/game/menu'; }, 2500);
            });

            socket.on('player-left', ({ username: leftName, team }) => {
                addLog(`${leftName} (Equipo ${team}) se desconectó`, 'warning');
                if (!gs.isOver() && myTeam) {
                    renderer.locked = true;
                    showGameOver(myTeam, gs.score, 'forfeit');
                }
            });

            socket.on('match-saved', ({ eloChanges }) => {
                if (!eloChanges || !myTeam) return;
                const change = eloChanges[myTeam];
                if (!change) return;

                const eloBox = document.getElementById('go-elo');
                const before = document.getElementById('go-elo-before');
                const after  = document.getElementById('go-elo-after');
                const delta  = document.getElementById('go-elo-delta');

                before.textContent = change.before;
                after.textContent  = change.after;
                const sign = change.delta >= 0 ? '+' : '';
                delta.textContent  = `${sign}${change.delta}`;
                delta.className    = `go-elo-delta ${change.delta >= 0 ? 'positive' : 'negative'}`;
                eloBox.classList.add('visible');
            });
        }
    </script>

    <script src="/js/components/toast.js"></script>
    <script src="/socket.io/socket.io.js"></script>
</body>

</html>
