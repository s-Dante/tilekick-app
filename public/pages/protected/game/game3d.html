<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TileKick - Juego 3D</title>
    <link rel="stylesheet" href="/styles/index.css">
</head>

<body>
    <div id="layout">

        <!-- Barra lateral -->
        <nav id="sidebar">
            <div id="sidebar-header">
                <h2>TileKick</h2>
            </div>
            <ul id="sidebar-nav">
                <li><a href="/dashboard">Inicio</a></li>
                <li><a href="/game/menu">Jugar</a></li>
                <li><a href="/leaderboard">Clasificación</a></li>
                <li><a href="/profile">Perfil</a></li>
                <li><a href="/settings">Configuración</a></li>
            </ul>
            <div id="sidebar-footer">
                <a href="/logout" id="logout-btn">Cerrar sesión</a>
            </div>
        </nav>

        <!-- Contenido principal -->
        <main id="content">
            <h1>Juego 3D</h1>

            <div id="game-info">
                <span>Sala: <strong id="room-id">—</strong></span>
                <span>Marcador: <strong id="score">0 - 0</strong></span>
                <span>Tiempo: <strong id="timer">05:00</strong></span>
            </div>

            <!-- Contenedor donde Three.js montará el renderer -->
            <div id="gameContainer" style="width: 800px; height: 500px; background: #000;">
                <!-- Three.js renderizará aquí -->
            </div>

            <div id="game-controls">
                <a href="/game/menu" id="exit-btn">Salir de la partida</a>
            </div>
        </main>

    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const params = new URLSearchParams(window.location.search);
        const roomId = params.get('room') || '—';
        document.getElementById('room-id').textContent = roomId;

        const socket = io();
        socket.emit('join-room', { roomId });

        // TODO: lógica del juego 3D con Three.js
    </script>
</body>

</html>
